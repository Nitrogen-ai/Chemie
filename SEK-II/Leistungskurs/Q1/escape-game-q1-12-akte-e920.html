<style>
:root{--bg:#10161d;--fl:#18222c;--li:#34434f;--tx:#e6edf3;--mt:#94a6b6;--ak:#6fd3c7;--al:#ff7b72;--ok:#7ee787;
--pa:#fbf8f1;--pt:#222;--pl:#d9d2c3;--blau:#2a7ab8;--rot:#b3261e;--gruen:#2e7d4f;--violett:#7b4fa0;--petrol:#1f7a7a;--grau:#6b7280}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif}
.mono,.uhr,h1,input,.term,.codefeld b{font-family:Menlo,Consolas,monospace}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--li)}
.kopf{max-width:900px;margin:0 auto;padding:10px 16px 8px;display:grid;grid-template-columns:auto 1fr auto;gap:6px 14px;align-items:center}
h1{font-size:20px;margin:0;color:var(--al);letter-spacing:.04em}
.uhr{font-size:26px;padding:2px 10px;border:1px solid var(--li);border-radius:8px;background:var(--fl);text-align:center}
.uhr.knapp{color:var(--al)}
form{display:flex;gap:8px;grid-column:1/-1}
input{flex:1;min-width:0;font-size:19px;padding:8px 10px;background:#0b1015;color:var(--tx);border:1px solid var(--ak);border-radius:6px;text-transform:uppercase}
button{font:inherit;padding:8px 14px;background:var(--ak);color:#07211e;border:0;border-radius:6px;font-weight:bold;cursor:pointer}
button.leise{background:none;color:var(--mt);border:1px solid var(--li);font-weight:normal;font-size:13px}
.meldung{grid-column:1/-1;min-height:20px;font-size:14px}.meldung.gut{color:var(--ok)}.meldung.schlecht{color:var(--al)}
.wort{display:flex;gap:3px;justify-content:flex-end}
.wort span{width:22px;height:26px;display:flex;align-items:center;justify-content:center;border:1px solid var(--li);border-radius:3px;font:bold 15px Menlo,monospace;background:var(--fl)}
.wort span.da{color:var(--ok);border-color:var(--ok)}
nav{max-width:900px;margin:0 auto;padding:0 12px 8px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav button{flex:none;background:var(--fl);color:var(--mt);border:1px solid var(--li);font-weight:normal;font-size:14px;padding:6px 11px}
nav button.an{color:var(--tx);border-color:var(--ak)}
nav button.zu{opacity:.45}
nav button.fertig::after{content:" ✓";color:var(--ok)}
main{max-width:900px;margin:0 auto;padding:14px 16px 60px}
.papier{background:var(--pa);color:var(--pt);border-radius:6px;padding:18px 20px;box-shadow:0 2px 0 var(--pl)}
.papier h2{margin:4px 0 6px;font-size:26px}.papier h3{margin:4px 0 10px;font-size:19px}
.akopf{display:flex;justify-content:space-between;align-items:center;border-bottom:1.5px solid #2f3a45;padding-bottom:5px;margin-bottom:12px;font:bold 13px Menlo,monospace;color:#2f3a45}
.chip{color:#fff;border-radius:10px;padding:2px 9px;font:bold 12px -apple-system,Helvetica,sans-serif}
.mitte{text-align:center}.alarm{color:var(--rot)}.gross{font-size:19px;margin-top:0}.leise{color:var(--grau);font-size:13px}.klein{font-size:13px}span.rot{color:var(--rot);font-weight:bold}
.term{background:#eef1f4;border:1px solid #2f3a45;border-radius:4px;padding:10px;font-size:13.5px;color:#2f3a45;margin:10px 0}
.kasten{border:1.3px solid var(--k,#999);background:var(--kh,#f3f3f3);border-radius:5px;padding:9px 11px;margin:10px 0}
.kasten .kt{font-weight:bold;color:var(--k,#333);margin-bottom:3px}
.kasten.rot{--k:var(--rot);--kh:#fbeceb}.kasten.blau{--k:var(--blau);--kh:#e7f0f8}.kasten.gruen{--k:var(--gruen);--kh:#e9f4ee}.kasten.violett{--k:var(--violett);--kh:#f1eaf5}.kasten.petrol{--k:var(--petrol);--kh:#e3f1f1}
.drei{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.zwei{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.zwei.breit-links{grid-template-columns:3fr 2fr;align-items:start}
.drei .kasten,.zwei .kasten{margin:0}
.wk{display:flex;gap:10px;align-items:center;border:1px solid #bbb;border-radius:5px;padding:8px;background:#fff}
.wkb{font-size:28px;font-weight:bold;color:var(--blau);width:30px;text-align:center}
.schritt{border:1px solid #bbb;border-radius:5px;padding:8px;background:#fff}
.gleichung,.formel{text-align:center;font-size:18px;margin:12px 0;padding:10px;background:#fff;border:1px dashed #999;border-radius:5px}
.luecke{display:inline-block;min-width:34px;border-bottom:2px solid var(--rot);color:var(--rot);font-weight:bold}
.ha{color:#c0392b;font-weight:bold}.hb{color:#2a7ab8;font-weight:bold}
.auftrag{margin:12px 0;padding:9px 11px;border-left:4px solid #2f3a45;background:#f1efe8}
.codefeld{border:1.6px dashed #2f3a45;border-radius:5px;padding:9px 11px;margin:12px 0;font-size:15px}
.codefeld b{color:#2f3a45}
.randnotiz{border-left:3px solid #aaa;padding-left:9px;color:#555;font-size:14px}
.erf{display:inline-block;font-size:11px;font-weight:bold;color:#8a4b00;background:#fff1d6;border:1px solid #d9822b;border-radius:3px;padding:0 5px;vertical-align:middle}
figure{margin:10px 0}figcaption{font-size:12px;color:var(--grau);text-align:center}
table{border-collapse:collapse;width:100%;font-size:14.5px;margin:10px 0;background:#fff}td,th{border:1px solid #bbb;padding:5px 7px;text-align:left}th{background:#e7f0f8}
.hinweise{margin-top:18px;border-top:1px dashed #999;padding-top:10px}
.hinweis{border:1.3px dashed var(--grau);border-radius:5px;padding:8px 10px;margin:8px 0;background:#fff}
.hinweise button{background:#2f3a45;color:#fff;font-weight:normal;font-size:14px}
.karte{border:1.3px solid var(--k);border-radius:5px;background:#fff;padding:9px 11px;display:flex;flex-direction:column;gap:5px}
.karte .kn{display:flex;justify-content:space-between;align-items:center}
.karte .nr{font:bold 22px Menlo,monospace;color:var(--k)}
.karte .q{font-size:11.5px;color:var(--grau)}
.karte .tx{font-size:14.5px}
.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:9px}
.sanger .bild{overflow-x:auto}.sanger svg{min-width:620px;width:100%;height:auto;display:block;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.sanger .zeile{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 10px}
.sanger .zeile button{background:#2f3a45;color:#fff;font-weight:normal;font-size:14px}
.sanger .zeile button.leer{background:none;color:#2f3a45;border:1px solid #2f3a45}
.ksm{font-size:14px;color:#2f3a45}
.kette .reihe{display:grid;grid-template-columns:110px repeat(3,1fr);gap:6px;align-items:center;margin-bottom:6px}
.kette .lbl{font-size:13px;color:var(--grau)}
.kette .slot{height:46px;border:1.5px dashed #999;border-radius:5px;display:flex;align-items:center;justify-content:center;font:bold 18px Menlo,monospace;cursor:pointer;background:#fff}
.kette .slot.voll{border-style:solid;border-color:#2f3a45}
.kette .aus{grid-template-columns:110px repeat(5,1fr)}
.kette .aus .slot.voll{border-color:var(--rot);color:var(--rot)}
.pool{margin-top:12px}
.pool .karte .knoepfe{display:flex;gap:6px}.pool .karte button{font-size:13px;padding:5px 9px;background:#2f3a45;color:#fff;font-weight:normal}
.pool .karte button.weg{background:none;color:var(--rot);border:1px solid var(--rot)}
.pruef{margin:10px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.pruef button{background:#2f3a45;color:#fff}
#kmeld{font-size:14px}
textarea{width:100%;min-height:60px;font:inherit;font-size:15px;padding:7px;border:1px solid #bbb;border-radius:5px;margin:4px 0 10px}
.ende{border:1px solid var(--ok);border-radius:8px;padding:12px;margin:0 0 14px;color:var(--tx)}
.sperre{color:var(--mt);text-align:center;padding:40px 10px}
.wahl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 4px}
.wahl button{background:#fff;color:#222;border:2px solid #bbb;border-radius:8px;padding:6px 6px 8px;font-weight:bold;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:2px}
.wahl button svg{width:100%;max-width:120px;height:auto}
.wahl button.an{border-color:var(--violett);background:#f1eaf5;box-shadow:0 0 0 2px var(--violett)}
.wahl button[disabled]{cursor:default}.wahl button[disabled]:not(.an){opacity:.45}
.wahlinfo{font-size:14px;color:#2f3a45}
.material{border:2px solid var(--gruen);background:#e9f4ee;border-radius:6px;padding:9px 11px;margin:0 0 12px}
.material summary{cursor:pointer;font-weight:bold;color:var(--gruen)}
.material .raster{margin-top:9px}
.loes a.knopf{display:inline-block;background:var(--violett);color:#fff;text-decoration:none;font-weight:bold;padding:10px 18px;border-radius:6px;margin:6px 0}
#start{margin:14px 0;text-align:center}#start button{font-size:19px;padding:12px 26px}
@media (max-width:640px){.wahl{grid-template-columns:1fr 1fr}.drei,.zwei,.zwei.breit-links{grid-template-columns:1fr}.kopf{grid-template-columns:1fr auto}.wort{grid-column:1/-1;justify-content:flex-start}
 .papier{padding:14px 12px}.kette .reihe{grid-template-columns:70px repeat(3,1fr)}.kette .aus{grid-template-columns:repeat(5,1fr)}.kette .aus .lbl{grid-column:1/-1}}

const ERSTE = {"titel": "Sangers Streifen", "html": "\n<h3>Wie hält Keratin überhaupt zusammen?</h3>\n<p>Um E 920 zu verstehen, braucht die Task Force die Bindung, die Haar so haltbar macht. Das Musterbeispiel liegt in einem Archiv in Cambridge: Frederick Sanger entschlüsselte 1955 als Erster, wo in einem Protein die Disulfidbrücken liegen. Sein Protein war Insulin vom Rind, das menschliche Insulin unten unterscheidet sich nur an wenigen Stellen.</p>\n<div class=\"kasten blau\"><div class=\"kt\">Fragmentanalyse nach Teilhydrolyse (nach Ryle, Sanger, Smith, Kitai 1955)</div>Fragment I enthält A-Kette, Rest 6 und Rest 11, über S–S verbunden.<br>Fragment II enthält A-Kette, Rest 7, und B-Kette, Rest 7, über S–S verbunden.<br>Fragment III enthält A-Kette, Rest 20, und B-Kette, Rest 19, über S–S verbunden.</div>\n<div data-widget=\"sanger\"></div>\n<div class=\"auftrag\"><b>Auftrag.</b> Suchen Sie alle Cysteinreste (Einbuchstabencode C). Tippen Sie nacheinander zwei Reste an, um sie laut Fragmentanalyse mit einer Brücke zu verbinden. Tippen Sie auf „Falten“ und beobachten Sie, was mit den geraden Ketten passiert. Halten Sie im Logbuch fest, was die Brücken bewirken.</div>\n<div class=\"codefeld\"><b>CODE FÜR DAS TERMINAL</b><br>① Anzahl Cysteinreste · ② Anzahl Brücken · ③ Brücken innerhalb einer Kette · ④ Brücken zwischen den Ketten</div>\n<p class=\"leise\">Modell: Die Ketten zeigen Reihenfolge und Brücken, aber nicht Abstände und echte Faltung. Sequenz: UniProt P01308.</p>\n", "hinweise": ["Im Einbuchstabencode steht C für Cystein. Zählen Sie alle C in beiden Ketten.", "Jede Brücke braucht genau zwei C. Prüfen Sie je Fragment: Stammen beide C aus derselben Kette?"], "karten": [{"nr": 7, "a": 1, "t": "Haar besteht vor allem aus Keratin. Von 100 Aminosäureresten im Haar sind rund 16 Cysteinbausteine. In den meisten anderen Proteinen sind es nur 1 bis 2 von 100. Deshalb war Haar lange ein billiger Rohstoff für Cystein.", "q": "Robbins, <i>Chemical and Physical Behavior of Human Hair</i>; J. Soc. Cosmet. Chem."}, {"nr": 2, "a": 1, "t": "Cystein trägt in der Seitenkette eine Thiolgruppe (–SH). Zwei Thiolgruppen reagieren unter Oxidation zu einer Disulfidbrücke (–S–S–). Aus zwei Cysteinmolekülen entsteht so Cystin, aus zwei Cysteinresten eine kovalente Verbindung quer durch das Protein.", "q": "Baumann 1884; Mörner, Z. physiol. Chem. 28 (1899)"}, {"nr": 14, "a": 1, "t": "Frederick Sanger klärte 1955 auf, wo die Brücken im Insulin liegen: eine innerhalb der A-Kette, zwei zwischen A- und B-Kette. Ohne diese drei Brücken ist Insulin nicht aktiv. Für die Sequenz des Insulins erhielt Sanger 1958 den Nobelpreis.", "q": "Ryle, Sanger, Smith, Kitai, Biochem. J. 60 (1955) 541"}, {"nr": 10, "a": 1, "t": "Cystein kann Radikale abfangen. Deshalb steckt die Aminosäure auch in manchen Kosmetikprodukten und Nahrungsergänzungsmitteln.", "q": "Kosmetik-Datenbank"}]};

const GLOSSAR = "<b>Mehlbehandlungsmittel:</b> Stoff, der Mehl oder Teig zugesetzt wird, um die Backeigenschaften zu verbessern.<br>\n<b>Gluten (Kleber):</b> Stoffgemisch aus Weizenproteinen, verknüpft über Disulfidbrücken innerhalb und zwischen den Ketten.<br>\n<b>Cystin:</b> zwei über eine Disulfidbrücke verbundene Cysteinmoleküle.<br>\n<b>Thiolgruppe:</b> –SH. <b>Disulfidbrücke:</b> –S–S–.<br>\n<b>E-Nummer:</b> EU-Kennnummer eines zugelassenen Zusatzstoffs. <b>Spezifikation:</b> rechtlich festgelegte Anforderungen an einen Zusatzstoff.";

  } else if (S.tab === 'archiv') {
    const k = alleKarten();
    h = `<div class="papier">${kopfzeile('Archivkarten')}<p>Bisher ${k.length} von 20 Karten. Mit jeder geöffneten Akte kommen vier dazu.</p><div class="raster">${k.map(x => karteHTML(x)).join('')}<div class="karte" style="--k:#2f3a45"><div class="nr" style="font-size:16px">GLOSSAR</div><div class="tx">${GLOSSAR}</div></div></div></div>`;
  } else if (S.tab === 'loesung') {
    h = `<div class="papier loes">${kopfzeile('Lösungsblatt · Mitschrift sichern')}<p>Die Lehrperson hat das Lösungsblatt freigegeben. Es enthält das Logbuch, die Teilgleichungen mit Strukturformeln in Lewis-Schreibweise, die Beweiskette und Musterantworten.</p><ol><li>Öffnen Sie das Lösungsblatt.</li><li>Vergleichen Sie es Zeile für Zeile mit Ihrem Aufgabenblatt.</li><li>Ergänzen und korrigieren Sie in einer anderen Farbe, vor allem die Strukturformeln in Aufgabe 2.</li><li>Speichern Sie das Lösungsblatt zusätzlich in Ihren Unterlagen (Teilen → In Dateien sichern oder in GoodNotes öffnen).</li></ol><a class="knopf" id="pdf" href="#" download="Q1 12 Akte E 920 – Lösungsblatt.pdf">Lösungsblatt öffnen (PDF)</a></div>`;
  } else if (S.tab === 'finale') {
    const c = inhalt(6);
    h = c ? `<div class="papier">${kopfzeile('Finale · Pressekonferenz')}${c.html}</div>` : '<div class="sperre">Gesperrt.</div>';
  } else {
    const n = +S.tab.slice(1), c = inhalt(n);
    if (!c) h = '<div class="sperre">Gesperrt.</div>';
    else {
      const used = S.hw[n] || 0;
      let hw = `<div class="hinweise"><b>Hinweise</b> <span class="leise">(werden gezählt)</span>`;
      for (let i = 0; i < used; i++) hw += `<div class="hinweis"><b>Hinweis ${i + 1}:</b> ${c.hinweise[i]}</div>`;
      if (used < c.hinweise.length) hw += `<button type="button" id="hwk" data-n="${n}">Hinweis ${used + 1} aufdecken</button>`;
      hw += '</div>';
      const mat = `<details class="material" ${n <= S.stufe ? '' : 'open'}><summary>📂 Material zuerst: Archivkarten ${c.karten.map(k => k.nr).join(' · ')} (antippen zum Ein- und Ausklappen)</summary><p class="klein">Diese vier Karten kamen mit der Akte ins Archiv. Sie enthalten das Wissen, das Sie hier brauchen. Nicht jede Karte gehört zum Fall.</p><div class="raster">${c.karten.map(x => karteHTML(x)).join('')}</div></details>`;
      h = `<div class="papier">${kopfzeile('Akte ' + n + ' · ' + c.titel, n)}${mat}${c.html}${hw}</div>`;
    }
  }
  z.innerHTML = h;
  z.querySelectorAll('[data-widget]').forEach(el => WIDGETS[el.dataset.widget] && WIDGETS[el.dataset.widget](el));
  if ($('los')) $('los').onclick = () => {
    if (!S.wahl[0]) { $('meld').textContent = 'Wählen Sie zuerst zu zweit eine Cystein-Quelle (oben im Einsatzbefehl).'; $('meld').className = 'meldung schlecht'; document.querySelector('.wahl').scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
    $('meld').textContent = ''; S.start = Date.now(); S.tab = 'a1'; sichern(); zeichne(); ticke(); $('code').focus(); };
  if ($('pdf')) { try { const b = Uint8Array.from(atob(LOESUNG), c => c.charCodeAt(0)), k = strom(S.loes, b.length); $('pdf').href = URL.createObjectURL(new Blob([b.map((x, i) => x ^ k[i])], { type: 'application/pdf' })); } catch (e) {} }
  if ($('hwk')) $('hwk').onclick = e => {
    const b = e.target;
    if (!b.dataset.sicher) { b.dataset.sicher = 1; b.textContent = 'Archivkarten oben schon gelesen? Dann erneut tippen'; return; }
    const n = +b.dataset.n; S.hw[n] = (S.hw[n] || 0) + 1; sichern(); zeichne();
  };
}
function fmt(s){ return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function ticke(){
  if (S.start === null) { $('uhr').textContent = fmt(DAUER); return; }
  const ref = S.fertig !== null ? S.fertig : Date.now();
  const r = Math.round(DAUER - (ref - S.start) / 1000); $('uhr').textContent = r >= 0 ? fmt(r) : '−' + fmt(-r); $('uhr').classList.toggle('knapp', r < 300);
}
function pruefe(wert){
  const c = norm(wert), m = $('meld');
  if (!c) return;
  if (fnv(c) === FREI_H) { S.loes = c; S.tab = 'loesung'; m.textContent = 'Lösungsblatt freigegeben.'; m.className = 'meldung gut'; sichern(); zeichne(); window.scrollTo(0, 0); return; }
  if (S.stufe >= AKTEN.length && S.fertig !== null) { m.textContent = 'Das Lösungswort ist schon bestätigt. Das Freigabewort für das Lösungsblatt nennt die Lehrperson.'; m.className = 'meldung schlecht'; return; }
  if (S.stufe < AKTEN.length) {
    if (fnv(c) !== AKTEN[S.stufe].h) { m.textContent = 'Code abgelehnt. Prüfen Sie die Akte oder decken Sie einen Hinweis auf.'; m.className = 'meldung schlecht'; return; }
    const f = entschluessle(AKTEN[S.stufe].f, c), neu = [];
    for (let i = 0; i < f.length; i += 2) { S.frag[f[i + 1]] = f[i]; neu.push(f[i] + ' an Stelle ' + f[i + 1]); }
    S.codes.push(c); S.stufe++;
    S.tab = S.stufe < AKTEN.length ? 'a' + (S.stufe + 1) : 'finale';
    m.textContent = 'Code korrekt. Buchstabe ' + neu.join(', ') + '. ' + (S.stufe < AKTEN.length ? 'Akte ' + (S.stufe + 1) + ' ist offen, vier neue Archivkarten.' : 'Das Finale ist offen.'); m.className = 'meldung gut';
  } else {
    if (fnv(c) !== FINAL) { m.textContent = 'Lösungswort abgelehnt.'; m.className = 'meldung schlecht'; return; }
    S.fertig = Date.now(); m.textContent = 'Lösungswort bestätigt.'; m.className = 'meldung gut';
  }
  sichern(); zeichne(); ticke(); window.scrollTo(0, 0);
}

// ---------- Widgets
const WIDGETS = {};
WIDGETS.sanger = el => {
  const A = 'GIVEQCCTSICSLYQLENYCN', B = 'FVNQHLCGSHLVEALYLVCGERGFFYTPKT';
  const W = 720, H = 250, dx = 22.6, x0 = 26;
  const gerade = (k, i) => k === 'A' ? [x0 + i * dx, 55] : [x0 + i * dx, 200];
  // gefaltete Lage: B bleibt gerade, A legt sich mit einer Schleife (A6–A11) über B7 und B19
  const xb = i => x0 + i * dx;
  function gefaltet(k, i){
    if (k === 'B') return [xb(i), 200];
    const r = i + 1;
    if (r >= 6 && r <= 11) { const cx = xb(6), cy = 100, rr = 44, w = (90 + (7 - r) * 60) * Math.PI / 180; return [cx + rr * Math.cos(w), cy + rr * Math.sin(w)]; }
    if (r < 6) { const [ax, ay] = gefaltet('A', 5); return [ax - (6 - r) * dx * .95, ay + (6 - r) * 6]; }
    const [ax, ay] = gefaltet('A', 10), sx = ax - 10, sy = ay - 30, ex = xb(18), ey = 144;
    if (r === 20) return [ex, ey];
    if (r === 21) return [ex + dx, ey + 8];
    const t = (r - 12) / 8, cxp = (sx + ex) / 2 + 20, cyp = -45;
    return [(1 - t) * (1 - t) * sx + 2 * t * (1 - t) * cxp + t * t * ex, (1 - t) * (1 - t) * sy + 2 * t * (1 - t) * cyp + t * t * ey];
  }
  let phase = 0, wahl = null, anim = null;
  const pos = (k, i) => { const a = gerade(k, i), b = gefaltet(k, i), e = phase * phase * (3 - 2 * phase); return [a[0] + (b[0] - a[0]) * e, a[1] + (b[1] - a[1]) * e]; };
  const RICHTIG = ['A6-A11', 'A7-B7', 'A20-B19'];
  const key = (p, q) => [p, q].sort((u, v) => (u[0] + u.slice(1).padStart(2, '0')).localeCompare(v[0] + v.slice(1).padStart(2, '0'))).join('-');
  function male(){
    let s = `<svg viewBox="0 0 ${W} ${H}">`;
    const ketten = [['A', A], ['B', B]];
    for (const [k, seq] of ketten) {
      const p = [...seq].map((_, i) => pos(k, i).map(v => v.toFixed(1)).join(','));
      s += `<polyline points="${p.join(' ')}" fill="none" stroke="#9aa7b4" stroke-width="3" stroke-linejoin="round"/>`;
    }
    for (const b of S.brueck) {
      const [p, q] = b.split('-'), P = pos(p[0], +p.slice(1) - 1), Q = pos(q[0], +q.slice(1) - 1);
      const same = p[0] === q[0] && phase < .5, my = Math.min(P[1], Q[1]) - 60 * (1 - phase);
      s += same ? `<path d="M${P[0]},${P[1]} Q${(P[0] + Q[0]) / 2},${my} ${Q[0]},${Q[1]}" fill="none" stroke="#d9822b" stroke-width="4"/>` : `<line x1="${P[0]}" y1="${P[1]}" x2="${Q[0]}" y2="${Q[1]}" stroke="#d9822b" stroke-width="4"/>`;
    }
    for (const [k, seq] of ketten) [...seq].forEach((ch, i) => {
      const [x, y] = pos(k, i), id = k + (i + 1), c = ch === 'C', an = wahl === id;
      s += `<g data-id="${id}" data-c="${c ? 1 : 0}" style="cursor:${c ? 'pointer' : 'default'}"><circle cx="${x}" cy="${y}" r="10.5" fill="${an ? '#d9822b' : c ? '#ffe7a8' : '#fff'}" stroke="${c ? '#b8860b' : '#2f3a45'}" stroke-width="${c ? 2 : 1}"/><text x="${x}" y="${y + 4.6}" text-anchor="middle" font-family="Menlo,monospace" font-size="13" font-weight="bold" fill="#222">${ch}</text>`
        + (phase < .02 ? `<text x="${x}" y="${k === 'A' ? y - 15 : y + 24}" text-anchor="middle" font-size="8.5" fill="#888">${i + 1}</text>` : '') + '</g>';
    });
    s += (phase < .02 ? `<text x="4" y="59" font-size="12" font-weight="bold" fill="#2f3a45">A</text>` : '') + `<text x="4" y="204" font-size="12" font-weight="bold" fill="#2f3a45">B</text></svg>`;
    el.querySelector('.bild').innerHTML = s;
    el.querySelectorAll('g[data-id]').forEach(g => g.addEventListener('click', () => tippe(g.dataset.id, g.dataset.c === '1')));
    el.querySelector('.ksm').textContent = S.brueck.length ? 'Brücken: ' + S.brueck.join(', ') : 'Noch keine Brücken.';
    el.querySelector('#falt').textContent = phase > .5 ? 'Strecken' : 'Falten';
  }
  function tippe(id, c){
    if (phase > 0) return;
    if (!c) { el.querySelector('.ksm').textContent = id + ' ist kein Cysteinrest.'; return; }
    if (wahl === null) { wahl = id; male(); return; }
    if (wahl === id) { wahl = null; male(); return; }
    const k = key(wahl, id);
    const belegt = S.brueck.some(b => b.split('-').includes(wahl) || b.split('-').includes(id));
    if (S.brueck.includes(k)) S.brueck = S.brueck.filter(b => b !== k);
    else if (belegt) { el.querySelector('.ksm').textContent = 'Ein Cysteinrest bildet nur eine Brücke. Lösen Sie zuerst die alte Brücke (beide Reste antippen).'; wahl = null; sichern(); return male(); }
    else S.brueck.push(k);
    wahl = null; sichern(); male();
  }
  el.className = 'sanger';
  el.innerHTML = '<div class="bild"></div><div class="zeile"><button type="button" id="falt">Falten</button><button type="button" class="leer" id="loes">Alle Brücken lösen</button><span class="ksm"></span></div>';
  el.querySelector('#loes').onclick = () => { if (phase > 0) return; S.brueck = []; wahl = null; sichern(); male(); };
  el.querySelector('#falt').onclick = () => {
    const ok = RICHTIG.every(r => S.brueck.includes(r)) && S.brueck.length === 3;
    if (phase === 0 && !ok) { el.querySelector('.ksm').textContent = 'So faltet sich nichts sinnvoll. Prüfen Sie die Brücken mit der Fragmentanalyse.'; return; }
    const ziel = phase > .5 ? 0 : 1, t0 = performance.now(), von = phase;
    cancelAnimationFrame(anim);
    const schritt = t => { const u = Math.min(1, (t - t0) / 1400); phase = von + (ziel - von) * u; male(); if (u < 1) anim = requestAnimationFrame(schritt); };
    anim = requestAnimationFrame(schritt);
  };
  male();
};

WIDGETS.kette = el => {
  const LBL = ['Brücke', 'Struktur', 'Gewinnung', 'Teig', 'Recht, Beweis'];
  el.className = 'kette';
  function male(){
    const genutzt = new Set([...S.slots, ...S.aus].filter(Boolean)), karten = alleKarten();
    let h = '';
    for (let r = 0; r < 5; r++) {
      h += `<div class="reihe"><span class="lbl">${LBL[r]}</span>` + [0, 1, 2].map(j => { const i = r * 3 + j, v = S.slots[i]; return `<div class="slot ${v ? 'voll' : ''}" data-s="k${i}">${v || ''}</div>`; }).join('') + '</div>';
    }
    h += `<div class="reihe aus"><span class="lbl" style="color:#b3261e">aussortiert</span>` + S.aus.map((v, i) => `<div class="slot ${v ? 'voll' : ''}" data-s="a${i}">${v || ''}</div>`).join('') + '</div>';
    h += '<div class="pruef"><button type="button" id="kpr">Kette prüfen</button><span id="kmeld"></span></div>';
    h += '<div class="pool raster">' + karten.filter(k => !genutzt.has(k.nr)).map(k => karteHTML(k, `<div class="knoepfe"><button type="button" data-k="${k.nr}">→ Kette</button><button type="button" class="weg" data-x="${k.nr}">aussortieren</button></div>`)).join('') + '</div>';
    el.innerHTML = h;
    el.querySelectorAll('[data-s]').forEach(d => d.onclick = () => { const s = d.dataset.s, i = +s.slice(1); if (s[0] === 'k') S.slots[i] = 0; else S.aus[i] = 0; sichern(); male(); });
    el.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { const i = S.slots.indexOf(0); if (i < 0) return melde('Die Kette ist voll. Legen Sie eine Karte zurück.'); S.slots[i] = +b.dataset.k; sichern(); male(); });
    el.querySelectorAll('[data-x]').forEach(b => b.onclick = () => { const i = S.aus.indexOf(0); if (i < 0) return melde('Es werden genau fünf Karten aussortiert.'); S.aus[i] = +b.dataset.x; sichern(); male(); });
    el.querySelector('#kpr').onclick = () => {
      if (S.slots.includes(0) || S.aus.includes(0)) return melde('Erst alle 20 Karten legen.');
      const d = fnv([...S.aus].sort((a, b) => a - b).join('-')) === DISTR_H, k = fnv(S.slots.join('-')) === KETTE_H;
      melde(k && d ? 'Die Kette stimmt mit der Archivleitung überein. Übertragen Sie sie ins Aufgabenblatt.' : d ? 'Die aussortierten Karten stimmen. Die Reihenfolge weicht von der Archivleitung ab. Lesen Sie die Kette laut mit „deshalb“ vor oder begründen Sie Ihre Reihenfolge bei der Spielleitung.' : 'Mindestens eine aussortierte Karte gehört zur Leitfrage. Prüfen Sie: Was ist richtig, aber unerheblich?');
    };
  }
  function melde(t){ const m = el.querySelector('#kmeld'); if (m) m.textContent = t; }
  male();
};

WIDGETS.wahl = el => {
  const r = +el.dataset.runde - 1, fest = r === 0 && S.start !== null;
  let h = '<div class="wahl">' + QUELLEN.map(q => `<button type="button" data-q="${q.id}" class="${S.wahl[r] === q.id ? 'an' : ''}" ${fest ? 'disabled' : ''}>${q.svg}<span>${q.name}</span></button>`).join('') + '</div>';
  if (r === 0) h += `<div class="wahlinfo">${fest ? 'Ihre Wahl ist gespeichert. Im Finale wählen Sie noch einmal.' : S.wahl[0] ? 'Gewählt. Jetzt unten „Einsatz starten“.' : 'Noch keine Wahl.'}</div>`;
  else h += `<div class="wahlinfo">Zu Beginn gewählt: <b>${S.wahl[0] ? QUELLEN.find(x => x.id === S.wahl[0]).name : '–'}</b></div><textarea id="grund" placeholder="Unsere Wahl hat sich (nicht) geändert, weil …">${esc(S.grund || '')}</textarea>`;
  el.innerHTML = h;
  if (!fest) el.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { S.wahl[r] = b.dataset.q; sichern(); WIDGETS.wahl(el); });
  const g = el.querySelector('#grund'); if (g) g.oninput = () => { S.grund = g.value; sichern(); };
};

WIDGETS.presse = el => {
  el.innerHTML = [0, 1, 2].map(i => `<label><b>Frage ${i + 1}:</b><textarea data-i="${i}">${esc(S.presse[i] || '')}</textarea></label>`).join('');
  el.querySelectorAll('textarea').forEach(t => t.oninput = () => { S.presse[+t.dataset.i] = t.value; sichern(); });
};

$('nav').onclick = e => { const b = e.target.closest('button[data-tab]'); if (!b || !offen(b.dataset.tab)) return; S.tab = b.dataset.tab; sichern(); zeichne(); window.scrollTo(0, 0); };
$('form').onsubmit = e => { e.preventDefault(); pruefe($('code').value); $('code').value = ''; };
$('neu').onclick = () => { if ($('neu').dataset.sicher) { S = NEU(); sichern(); delete $('neu').dataset.sicher; $('neu').textContent = 'Neu beginnen'; $('meld').textContent = ''; zeichne(); ticke(); } else { $('neu').dataset.sicher = 1; $('neu').textContent = 'Wirklich alles löschen? Erneut tippen'; } };
laden(); zeichne(); ticke(); setInterval(ticke, 1000);
</script>
